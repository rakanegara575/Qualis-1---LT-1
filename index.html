    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #ffffff; color: #121212; height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }
        
        .header-logo { height: 30px; width: auto; object-fit: contain; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(130deg, #00ffcc, #00a2e8); border-radius: 10px; }

        #header {
            min-height: 60px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 15px;
            z-index: 1000;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-title-container { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        #header h1 { font-size: 13px; color: #00ffcc; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        
        .filter-select-container { position: relative; display: flex; align-items: center; }

        .filter-dropdown {
            background: rgba(30, 30, 30, 0.9);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(5px);
            appearance: none;
            padding-right: 24px;
        }

        .filter-select-container::after {
            content: "▼";
            font-size: 8px;
            color: #00ffcc;
            position: absolute;
            right: 8px;
            pointer-events: none;
        }

        .search-container { position: relative; width: 180px; }
        .search-input {
            width: 100%;
            padding: 5px 8px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 11px;
            outline: none;
        }
        
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
        }
        .search-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            border-bottom: 1px solid #333;
            color: #fff;
        }
        .search-item:hover { background: #00ffcc; color: #121212; font-weight: bold; }

        #map { height: 550px; width: 100%; background: #ffffff; flex-shrink: 0; }

        /* Style Section Tabel */
        .table-section {
            background: #ffffff;
            padding: 15px 20px;
            color: #000000;
            border-top: 2px solid #000000;
        }
        .table-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .table-header-flex h3 {
            font-size: 14px;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Layout Multi Kolom (Grid) */
        .table-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            align-items: start;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: #ffffff;
            border: 1.5px solid #000000;
        }
        .custom-table th {
            background: #f0f0f0;
            color: #000000;
            text-align: left;
            padding: 6px 10px;
            border: 1px solid #000000;
            font-weight: bold;
        }
        .custom-table td {
            padding: 4px 8px;
            border: 1px solid #000000;
            color: #000000;
        }

        /* Label Penomoran Gedung */
        .leaflet-tooltip.number-label {
            background: #111111 !important;
            color: #00ffcc !important;
            border: 1px solid #00ffcc !important;
            font-size: 11px !important;
            font-weight: bold !important;
            padding: 2px 6px !important;
            border-radius: 50%;
            white-space: nowrap;
            pointer-events: none !important;
            box-shadow: 0 0 4px rgba(0, 255, 204, 0.5);
        }

        /* Container Icon Teks */
        .custom-map-text-wrapper {
            background: transparent !important;
            border: none !important;
        }

        /* Styling Teks Kustom */
        .custom-map-text {
            color: #000000;
            font-weight: bold;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            text-shadow: 0px 0px 3px #ffffff, 0px 0px 3px #ffffff;
            pointer-events: auto;
            text-align: center;
            display: inline-block;
            transform: translate(-50%, -50%);
            user-select: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: #1e1e1e;
            width: 580px;
            max-width: 90%;
            border-radius: 8px;
            border: 1px solid #00ffcc;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
            position: relative;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h2 { font-size: 16px; color: #00ffcc; }
        .close-btn { cursor: pointer; font-size: 22px; color: #aaa; }
        .close-btn:hover { color: #fff; }
        
        .modal-body { font-size: 13px; line-height: 1.6; color: #ccc; }
        .building-number-badge { font-size: 28px; font-weight: bold; color: #00ffcc; margin-bottom: 2px; }
        .building-subtitle { font-size: 15px; font-weight: 600; color: #ffffff; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 12px; color: white; }

        .badge-abu { background: #b0b0b0; color: #000; }
        .category-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 12px; margin-left: 5px; background: #444; color: #fff; }

    </style>
</head>

        function getDoorEndpoints(door) {
            var rad = door.angle * (Math.PI / 180);
            var halfLen = door.length / 2;
            var dx = Math.cos(rad) * halfLen;
            var dy = Math.sin(rad) * halfLen;
            return [
                [door.center[0] - dy, door.center[1] - dx],
                [door.center[0] + dy, door.center[1] + dx]
            ];
        }

                    stroke: strokeVisible,
                    color: style.color || "#000000",

                    fillColor: style.fillColor,

                var rect = L.rectangle(room.coords, options).addTo(map);

        function filterCategory(cat) {
            roomLayers.forEach(function(layer, index) {
                var room = rooms[index];

                if (room.category === "abu" || room.customColor === "#ffffff") {
                    var style = room.customColor ? 
                        { fillColor: room.customColor, fillOpacity: 1.0 } : 
                        categoryStyles["abu"];

                    layer.setStyle({
                        color: "#000000",
                        fillColor: style.fillColor,
                        fillOpacity: style.fillOpacity,
                        stroke: true,
                        weight: 1.5,
                        opacity: 1
                    });
                    return;
                }

                if (cat === "semua" || room.category === cat) {
                    var style = room.customColor ? 
                        { fillColor: room.customColor, fillOpacity: 1.0 } : 
                        (categoryStyles[room.category] || categoryStyles["rendah"]);
                    
                    var strokeVisible = (room.hideBorder === true) ? false : true;

                    layer.setStyle({
                        color: "#000000",
                        fillColor: style.fillColor,
                        fillOpacity: style.fillOpacity,
                        stroke: strokeVisible,
                        weight: strokeVisible ? 1.5 : 0,
                        opacity: 1
                    });
                } else {
                    layer.setStyle({ opacity: 0.1, fillOpacity: 0.05 });
                }
            });
        }

        function handleSearch() {
            var query = document.getElementById('searchInput').value.toLowerCase();
            var resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (!query) {
                resultsContainer.style.display = 'none';
                return;
            }

            var matches = rooms.filter(r => 
                r.name.toLowerCase().includes(query) || 
                (r.number !== null && String(r.number) === query.trim())
            );

            if (matches.length > 0) {
                resultsContainer.style.display = 'block';
                matches.forEach(room => {
                    var div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerText = (room.number ? '#' + room.number + ' - ' : '') + room.name;
                    div.onclick = function() {
                        map.fitBounds(room.coords);
                        showInfoModal(room);
                        resultsContainer.style.display = 'none';
                    };
                    resultsContainer.appendChild(div);
                });
            } else {
                resultsContainer.style.display = 'none';
            }
        }

        function showInfoModal(room) {
            document.getElementById('modalNumber').innerText = room.number ? room.number : "Akses/Jalan";
            document.getElementById('modalTitle').innerText = "Sub Judul: " + room.name;
            document.getElementById('modalPic').innerText = room.pic || "-";
            document.getElementById('modalDesc').innerText = room.desc || "-";

            var statusBadge = document.getElementById('modalStatus');
            statusBadge.innerText = "Kategori: " + room.category.toUpperCase();
            statusBadge.className = "badge badge-" + room.category;

            document.getElementById('modalCategory').innerText = "Tipe Area: " + room.category;

            var equipList = document.getElementById('modalEquipment');
            equipList.innerHTML = '';
            if (room.equipment && room.equipment.length > 0) {
                room.equipment.forEach(eq => {
                    var li = document.createElement('li');
                    li.innerText = eq;
                    equipList.appendChild(li);
                });
            } else {
                equipList.innerHTML = '<li>Tidak ada data peralatan khusus.</li>';
            }

            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function checkCloseModal(e, modalId) {
            if (e.target.id === modalId) {
                closeModal(modalId);
            }
        }
